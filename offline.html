<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a1a"><title>Нет подключения — Валюткин</title><link rel="icon" href="assets/icon-192.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,#18345b,#0a0a1a 55%,#03030a);color:#eef7ff;font-family:Inter,system-ui,sans-serif}.offline{width:min(520px,100%);padding:35px;text-align:center;border:1px solid rgba(0,212,255,.2);border-radius:25px;background:rgba(10,10,26,.82);box-shadow:0 30px 90px rgba(0,0,0,.4);backdrop-filter:blur(20px)}img{width:90px;height:90px;border-radius:22px}.icon{font-size:45px;margin:12px}.offline h1{font-size:30px;margin:8px}.offline p{color:#aab8ca;line-height:1.6}.actions{display:grid;gap:10px;margin-top:22px}button,a{padding:13px 18px;border-radius:12px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}button{border:0;color:#fff;background:linear-gradient(100deg,#8b5cf6,#00d4ff)}a{color:#ddecff;border:1px solid rgba(0,212,255,.25)}small{display:block;margin-top:20px;color:#718096}</style></head><body><main class="offline"><img src="assets/icon-192.png" alt="Валюткин"><div class="icon">📡</div><h1>Нет подключения</h1><p>Интернет временно недоступен. Ранее открытые разделы и сохранённые данные по-прежнему могут работать офлайн.</p><div class="actions"><button onclick="location.reload()">Попробовать снова</button><a href="./">Открыть сохранённую главную</a></div><small id="status">Ожидаем сеть…</small></main><script>addEventListener('online',()=>{document.getElementById('status').textContent='Соединение восстановлено';setTimeout(()=>location.reload(),700)})</script><script src="i18n.js"></script></body></html>
