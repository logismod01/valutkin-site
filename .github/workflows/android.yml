name: Android TWA

on:
  pull_request:
    paths:
      - "android-twa/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Собрать подписанный AAB"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Проверить и собрать debug APK
        run: gradle lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: valutkin-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    environment: android-release
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Восстановить release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks
      - name: Подготовить Digital Asset Links
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fingerprint=$(keytool -list -v -keystore release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -1)
          test -n "$fingerprint"
          sed "s/RELEASE_SHA256_FINGERPRINT/$fingerprint/" ../.well-known/assetlinks.template.json > assetlinks.json
      - name: Собрать подписанный Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-twa/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace
      - name: Удалить keystore
        if: always()
        run: rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: valutkin-release-package
          path: |
            android-twa/app/build/outputs/bundle/release/app-release.aab
            android-twa/assetlinks.json
          if-no-files-found: error
