<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Календарь расходов — Валюткин</title><script>try{document.documentElement.dataset.theme=localStorage.getItem("valutkin_theme")||"dark"}catch{document.documentElement.dataset.theme="dark"}</script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="planner.css"><link rel="manifest" href="manifest.json"></head><body><header class="header"><a class="header-left" href="./"><img src="assets/logo.png" alt="" class="header-logo"><span class="header-title">Валюткин</span></a><div class="header-right"></div></header><main class="planner-page"><section class="planner-hero"><div><p class="eyebrow">ПЛАНИРОВАНИЕ БЕЗ БАНКА</p><h1>Будущие расходы</h1><p>Запланируйте покупки и платежи заранее. Данные остаются на этом устройстве.</p></div><button id="expense-add">＋ Добавить расход</button></section><section class="planner-stats"><article><span>Следующие 7 дней</span><b id="week-total">0 ₽</b></article><article><span>Этот месяц</span><b id="month-total">0 ₽</b></article><article><span>Запланировано</span><b id="expense-count">0</b></article></section><section class="planner-controls"><button id="month-prev">←</button><h2 id="planner-month"></h2><button id="month-next">→</button><select id="expense-filter"><option value="all">Все категории</option><option>Обязательное</option><option>Покупка</option><option>Подписка</option><option>Учёба</option><option>Другое</option></select></section><section id="expense-calendar" class="expense-calendar"></section><section><div class="section-head"><h2>Ближайшие расходы</h2><button id="expense-clear-done">Удалить выполненные</button></div><div id="expense-list" class="expense-list"></div></section></main><dialog id="expense-dialog"><form id="expense-form"><button type="button" id="expense-close" class="dialog-close">✕</button><h2>Запланировать расход</h2><input id="expense-id" type="hidden"><label>Название<input id="expense-title" required maxlength="60" placeholder="Например, подписка"></label><label>Сумма, ₽<input id="expense-amount" type="number" required min="1" step="1"></label><label>Дата<input id="expense-date" type="date" required></label><label>Категория<select id="expense-category"><option>Обязательное</option><option>Покупка</option><option>Подписка</option><option>Учёба</option><option>Другое</option></select></label><label>Повторение<select id="expense-repeat"><option value="none">Не повторять</option><option value="monthly">Каждый месяц</option><option value="yearly">Каждый год</option></select></label><button class="btn-primary" type="submit">Сохранить</button></form></dialog><script src="i18n.js"></script><script src="app-shell.js"></script><script src="planner.js"></script></body></html>
